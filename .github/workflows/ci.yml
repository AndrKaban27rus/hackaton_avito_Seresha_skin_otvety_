name: ci
permissions:
  contents: read
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: buddy_test, POSTGRES_USER: buddy, POSTGRES_PASSWORD: buddy}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U buddy" --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://buddy:buddy@localhost:5432/buddy_test?sslmode=disable
    defaults:
      run: {working-directory: backend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: backend/go.mod}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        with: {name: backend-coverage, path: backend/coverage.out}
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: frontend-coverage, path: frontend/coverage}
      - run: npm run build
