# Fixed project name: image and volume names must not depend on the clone folder name.
name: ai-buddy
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: {POSTGRES_DB: buddy, POSTGRES_USER: buddy, POSTGRES_PASSWORD: buddy}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U buddy -d buddy"], interval: 3s, timeout: 3s, retries: 20}
  api:
    build: ./backend
    # The API exits if the database is not up yet (e.g. after `docker compose restart`); Docker retries it.
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      DATABASE_URL: postgres://buddy:buddy@postgres:5432/buddy?sslmode=disable
      # Empty key = deterministic demo mode. Put the key in .env next to this file, never in git.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    depends_on:
      postgres: {condition: service_healthy}
  web:
    build: ./frontend
    restart: unless-stopped
    ports: ["3000:80"]
    depends_on: [api]
volumes:
  pgdata:
