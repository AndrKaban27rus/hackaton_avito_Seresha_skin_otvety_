server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker DNS: the API address is resolved per request, so nginx starts before the api container.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8080;

  # UI and API share one origin: no CORS, the session cookie works.
  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    # Keep host:port, the API compares Origin with Host.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # A chat message may need two model calls of up to 90 s each.
    proxy_read_timeout 180s;
  }

  # Synthetic resource pages (Confluence, Grafana, Bitbucket) are rendered by the API.
  location /demo/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
