server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Встроенный DNS Docker. Адрес API ищется при каждом запросе,
  # поэтому nginx запускается, даже если контейнер api ещё не поднялся.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8080;

  # Интерфейс и API на одном адресе: без CORS, куки сессии работают.
  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Ответ LLM может идти дольше обычного запроса.
    proxy_read_timeout 60s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
